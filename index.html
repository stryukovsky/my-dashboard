<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Погода</title>
  <style>
    :root {
      --ink: #1c1915;
      --muted: #6f685e;
      --line: rgba(28, 25, 21, 0.1);
      --card: rgba(255, 252, 246, 0.9);
      --up: #146c43;
      --up-bg: #e4f3ea;
      --down: #9f2d22;
      --down-bg: #f8e7e4;
      --card-x: 20px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(1000px 420px at 0% -10%, #f6edd8 0%, transparent 60%),
        radial-gradient(800px 480px at 100% 0%, #d7e0d6 0%, transparent 55%),
        #e5dfd2;
    }

    .wrap {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .when {
      padding-left: calc(var(--card-x) + 1px);
      text-align: left;
    }

    .clock {
      font-variant-numeric: tabular-nums;
      font-size: 72px;
      font-weight: 560;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }

    .date {
      margin-top: 6px;
      color: var(--ink);
      font-size: 28px;
      line-height: 1.1;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      background: var(--ink);
      color: #f6f1e7;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover { background: #322c26; }
    button:disabled { opacity: 0.55; cursor: wait; }

    .grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 14px;
      align-items: start;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 22px var(--card-x) 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(70, 48, 20, 0.06);
    }

    .card-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .label {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
    }

    .src {
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .src:hover { color: var(--ink); }

    .hero {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .sky {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      flex: none;
      border-radius: 22px;
      background: #efe6d4;
      color: #1c1915;
    }

    .sky[data-kind="clear"] { background: #f3e2b8; color: #8a5a12; }
    .sky[data-kind="partly"] { background: #f3e7cf; color: #6d5830; }
    .sky[data-kind="rain"],
    .sky[data-kind="storm"] { background: #e3eef3; color: #24556c; }
    .sky[data-kind="snow"],
    .sky[data-kind="fog"] { background: #e7e9ea; color: #4d555c; }
    .sky[data-kind="overcast"] { background: #e6e4de; color: #4c4a45; }

    .sky .ico { display: none; width: 42px; height: 42px; }
    .sky[data-kind="clear"] .ico-clear,
    .sky[data-kind="partly"] .ico-partly,
    .sky[data-kind="cloud"] .ico-cloud,
    .sky[data-kind="overcast"] .ico-overcast,
    .sky[data-kind="rain"] .ico-rain,
    .sky[data-kind="snow"] .ico-snow,
    .sky[data-kind="storm"] .ico-storm,
    .sky[data-kind="fog"] .ico-fog { display: block; }

    .temp {
      font-size: 76px;
      font-weight: 560;
      letter-spacing: -0.04em;
      line-height: 0.9;
      font-variant-numeric: tabular-nums;
    }

    .temp .unit {
      font-size: 0.55em;
      letter-spacing: 0;
      margin-left: 0.02em;
      vertical-align: super;
    }

    .price .unit {
      font-size: 1em;
      font-weight: 560;
      letter-spacing: 0;
      padding-left: 0.28em;
      vertical-align: baseline;
    }

    .rain {
      margin: 18px 0 0;
      font-size: 32px;
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .price-block { margin-top: 8px; }

    .pair {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .price {
      margin: 8px 0 0;
      font-size: 72px;
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .delta {
      display: inline-flex;
      margin-top: 14px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      background: #eeeae2;
      color: var(--muted);
    }

    .delta.up { color: var(--up); background: var(--up-bg); }
    .delta.down { color: var(--down); background: var(--down-bg); }

    .status {
      margin-top: auto;
      padding-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .card.is-error .status { color: var(--down); }
    .card.is-loading .status { opacity: 0.7; }

    /* iPad 10.2 landscape: 1080×810 */
    @media (min-width: 960px) and (max-height: 900px) {
      :root { --card-x: 16px; }

      .wrap {
        width: min(1040px, calc(100% - 24px));
        padding: 14px 0 16px;
      }

      header { margin-bottom: 12px; }
      .clock { font-size: 80px; }
      .date { font-size: 30px; }

      .card {
        min-height: 0;
        padding: 16px var(--card-x) 14px;
      }

      .card-top { margin-bottom: 8px; }
      .label { font-size: 17px; }
      .src { font-size: 14px; }
      .temp { font-size: 76px; }
      .rain { font-size: 34px; }
      .sky { width: 64px; height: 64px; border-radius: 18px; }
      .sky .ico { width: 36px; height: 36px; }
      .price { font-size: 72px; }
      .pair { font-size: 13px; }
      .delta { margin-top: 12px; font-size: 16px; }
      .status { padding-top: 12px; font-size: 13px; }
    }

    /* iPad 10.2 portrait: 810×1080, and narrower */
    @media (max-width: 900px) {
      :root { --card-x: 22px; }

      .wrap {
        width: min(740px, calc(100% - 28px));
        padding: 18px 0 28px;
      }

      header { align-items: flex-end; flex-wrap: wrap; }
      .when { text-align: left; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 0; padding: 22px var(--card-x) 18px; }
      .clock { font-size: 84px; }
      .date { font-size: 32px; }
      .label { font-size: 18px; }
      .src { font-size: 15px; }
      .temp { font-size: 96px; }
      .rain { font-size: 40px; }
      .sky { width: 88px; height: 88px; }
      .sky .ico { width: 48px; height: 48px; }
      .price { font-size: 80px; }
      .pair { font-size: 14px; }
      .delta { font-size: 18px; padding: 6px 12px; }
      .status { font-size: 14px; }
    }

    @media (max-width: 520px) {
      .temp { font-size: 72px; }
      .rain { font-size: 28px; }
      .price { font-size: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="when">
        <div class="clock" id="clock">—</div>
        <div class="date" id="today">—</div>
      </div>
      <button type="button" id="refresh">Обновить</button>
    </header>

    <main class="grid">
      <article class="card weather is-loading" id="weather-card" data-kind="cloud">
        <div class="card-top">
          <h2 class="label">Погода</h2>
          <a class="src" href="https://www.gismeteo.ru/weather-moscow-4368/" target="_blank" rel="noopener">Gismeteo</a>
        </div>
        <div class="hero">
          <div class="sky" id="sky" data-kind="cloud">
            <svg class="ico ico-clear" viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="24" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M24 7v4.5M24 36.5V41M7 24h4.5M36.5 24H41M12.2 12.2l3.2 3.2M32.6 32.6l3.2 3.2M35.8 12.2l-3.2 3.2M15.4 32.6l-3.2 3.2"/>
              </g>
            </svg>
            <svg class="ico ico-partly" viewBox="0 0 48 48" aria-hidden="true">
              <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none">
                <path d="M18 16.5v-3M12.2 18.2l-2-2M24.2 18.2l2-2M14 23.5H11"/>
                <circle cx="18.5" cy="23" r="4.2"/>
                <path d="M18 34h14.5a6.2 6.2 0 0 0 .8-12.3 8 8 0 0 0-15.4 2A5.4 5.4 0 0 0 18 34z"/>
              </g>
            </svg>
            <svg class="ico ico-cloud" viewBox="0 0 48 48" aria-hidden="true">
              <path d="M16.5 33.5h15a7 7 0 0 0 1-13.9 9 9 0 0 0-17.2 2.4 6 6 0 0 0 1.2 11.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <svg class="ico ico-overcast" viewBox="0 0 48 48" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                <path d="M14 28h12a5.5 5.5 0 0 0 .6-11 7 7 0 0 0-13.4 1.6A4.8 4.8 0 0 0 14 28z"/>
                <path d="M22 34h12.5a5.2 5.2 0 0 0 .5-10.3 6.4 6.4 0 0 0-12.2 1.4A4.5 4.5 0 0 0 22 34z"/>
              </g>
            </svg>
            <svg class="ico ico-rain" viewBox="0 0 48 48" aria-hidden="true">
              <path d="M16 28h15a6.4 6.4 0 0 0 .9-12.7 8.2 8.2 0 0 0-15.8 2.1A5.5 5.5 0 0 0 16 28z" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M18 32.5v5M24 33.5v6M30 32.5v5"/>
              </g>
            </svg>
            <svg class="ico ico-snow" viewBox="0 0 48 48" aria-hidden="true">
              <path d="M16 27.5h15a6.4 6.4 0 0 0 .9-12.7 8.2 8.2 0 0 0-15.8 2.1A5.5 5.5 0 0 0 16 27.5z" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <g fill="currentColor">
                <circle cx="18" cy="33.5" r="1.3"/>
                <circle cx="24" cy="36.5" r="1.3"/>
                <circle cx="30" cy="33.5" r="1.3"/>
              </g>
            </svg>
            <svg class="ico ico-storm" viewBox="0 0 48 48" aria-hidden="true">
              <path d="M16 26.5h15a6.2 6.2 0 0 0 .8-12.3 8 8 0 0 0-15.4 2A5.3 5.3 0 0 0 16 26.5z" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="M23 28.5l-3 6h5l-3 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
            <svg class="ico ico-fog" viewBox="0 0 48 48" aria-hidden="true">
              <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M12 18h24M10 24h28M13 30h22"/>
              </g>
            </svg>
          </div>
          <div>
            <div class="temp" id="temp">—</div>
          </div>
        </div>
        <p class="rain" id="rain">—</p>
        <p class="status" id="weather-status">Загрузка…</p>
      </article>

      <article class="card is-loading" id="btc-card">
        <div class="card-top">
          <h2 class="label">Bitcoin</h2>
          <a class="src" href="https://www.binance.com/en/trade/BTC_USDT" target="_blank" rel="noopener">Binance</a>
        </div>
        <div class="price-block">
          <p class="pair">BTC / USDT</p>
          <p class="price" id="btc">—</p>
          <div class="delta" id="btc-delta">—</div>
        </div>
        <p class="status" id="btc-status">Загрузка…</p>
      </article>

    </main>
  </div>

  <script>
    const WEATHER_URL = "https://www.gismeteo.ru/weather-moscow-4368/";
    const BTC_URL = "https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT";
    const TZ = "Europe/Moscow";

    const money = new Intl.NumberFormat("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const btcFmt = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
    const clockFmt = new Intl.DateTimeFormat("ru-RU", { hour: "2-digit", minute: "2-digit", timeZone: TZ });
    const dateFmt = new Intl.DateTimeFormat("ru-RU", { weekday: "long", day: "numeric", month: "long", timeZone: TZ });
    const updatedAt = { weather: 0, btc: 0 };
    const inflight = new Set();

    function tick() {
      const now = new Date();
      document.getElementById("clock").textContent = clockFmt.format(now);
      document.getElementById("today").textContent = dateFmt.format(now);
      for (const key of ["weather", "btc"]) {
        const at = updatedAt[key];
        const el = document.getElementById(key + "-status");
        if (!at || !el || el.dataset.mode === "error") continue;
        el.textContent = "обновлено " + ago(at) + (el.dataset.extra || "");
      }
    }

    function ago(ts) {
      const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
      if (s < 15) return "только что";
      if (s < 60) return s + " с назад";
      const m = Math.round(s / 60);
      if (m < 60) return m + " мин назад";
      const h = Math.round(m / 60);
      return h + " ч назад";
    }

    function kindOf(desc, icon) {
      const d = (desc || "").toLowerCase();
      const c = (icon || "").toLowerCase();
      if (d.includes("гроз") || /_t/.test(c)) return "storm";
      if (d.includes("снег") || d.includes("метел") || /_s/.test(c)) return "snow";
      if (d.includes("дожд") || d.includes("лив") || d.includes("морось") || /_r/.test(c)) return "rain";
      if (d.includes("туман") || d.includes("дымк") || d.includes("мгла") || /_f/.test(c)) return "fog";
      if (d.includes("пасмур") || /_c3/.test(c)) return "overcast";
      if (d.includes("малообл") || d.includes("перемен") || /_c1/.test(c)) return "partly";
      if (d.includes("ясно") || d.includes("солнеч") || c === "d" || c === "n") return "clear";
      return "cloud";
    }

    function rowAfter(html, marker) {
      const start = html.indexOf(marker);
      if (start < 0) return "";
      const end = html.indexOf('data-row="', start + marker.length);
      return html.slice(start, end > start ? end : start + 6000);
    }

    function rainToday(html) {
      const amounts = [...rowAfter(html, 'data-row="precipitation-bars"').matchAll(/class="item-unit">\s*([^<]+)/g)];
      if (!amounts.length) return null;
      const wet = /дожд|лив|морось|гроз|снег/;
      for (const item of amounts) {
        const raw = textOf(item[1]).toLowerCase().replace(",", ".");
        if (wet.test(raw)) return true;
        const n = parseFloat(raw.replace(/[^\d.]/g, ""));
        if (Number.isFinite(n) && n > 0) return true;
      }
      const icons = rowAfter(html, 'data-row="icon-tooltip"');
      const tips = [...icons.matchAll(/data-tooltip="([^"]+)"/g)].map(function (m) { return m[1].toLowerCase(); });
      const hrefs = [...icons.matchAll(/href="#([^"]+)"/g)].map(function (m) { return m[1].toLowerCase(); });
      if (tips.some(function (tip) { return wet.test(tip); })) return true;
      if (hrefs.some(function (href) { return /_r|_s|_t/.test(href); })) return true;
      return false;
    }

    function textOf(value) {
      const doc = new DOMParser().parseFromString(value, "text/html");
      return doc.documentElement.textContent.replace(/\s+/g, " ").trim();
    }

    function pick(block, re) {
      const m = block.match(re);
      return m ? textOf(m[1]) : "";
    }

    function parseWeather(html) {
      const tab = html.match(/<a class="weathertab"[\s\S]*?href="\/weather-moscow-4368\/now\/"[\s\S]*?<\/a>/);
      if (!tab) throw new Error("Не нашёл текущую погоду");
      const temp = pick(tab[0], /<temperature-value\b[^>]*value="(-?\d+(?:[.,]\d+)?)"/);
      if (!temp) throw new Error("Не нашёл температуру");
      const rain = rainToday(html);
      if (rain === null) throw new Error("Не нашёл прогноз осадков");
      return {
        temp,
        icon: pick(tab[0], /href="#([^"]+)"/),
        desc: pick(tab[0], /data-tooltip="([^"]+)"/),
        rain: rain
      };
    }

    function setFigure(id, value, unit) {
      const el = document.getElementById(id);
      el.replaceChildren(document.createTextNode(value));
      const mark = document.createElement("span");
      mark.className = "unit";
      mark.textContent = unit;
      el.append(mark);
    }

    function setDelta(id, value, text) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.classList.remove("up", "down");
      if (value > 0) el.classList.add("up");
      else if (value < 0) el.classList.add("down");
    }

    async function getText(url) {
      const ctrl = new AbortController();
      const timer = setTimeout(function () { ctrl.abort(); }, 12000);
      try {
        const res = await fetch(url, { cache: "no-store", signal: ctrl.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.text();
      } catch (err) {
        if (err && err.name === "AbortError") throw new Error("долго нет ответа");
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }

    function mark(card, mode, message) {
      card.classList.toggle("is-loading", mode === "loading");
      card.classList.toggle("is-error", mode === "error");
      const status = card.querySelector(".status");
      status.dataset.mode = mode === "error" ? "error" : "";
      if (message) status.textContent = message;
    }

    async function loadWeather() {
      const card = document.getElementById("weather-card");
      if (inflight.has("weather")) return;
      inflight.add("weather");
      mark(card, "loading");
      try {
        const data = parseWeather(await getText(WEATHER_URL));
        const kind = kindOf(data.desc, data.icon);
        card.dataset.kind = kind;
        document.getElementById("sky").dataset.kind = kind;
        setFigure("temp", data.temp, "°");
        document.getElementById("rain").textContent = data.rain ? "дождь будет" : "дождя не будет";
        updatedAt.weather = Date.now();
        mark(card, "ready", "обновлено только что");
        document.title = data.temp + "°";
      } catch (err) {
        mark(card, "error", "Не удалось прочитать Gismeteo. " + (err.message || "ошибка сети"));
      } finally {
        inflight.delete("weather");
      }
    }

    async function loadBtc() {
      const card = document.getElementById("btc-card");
      if (inflight.has("btc")) return;
      inflight.add("btc");
      mark(card, "loading");
      try {
        const data = JSON.parse(await getText(BTC_URL));
        const price = Number(data.lastPrice);
        const change = Number(data.priceChangePercent);
        if (!Number.isFinite(price)) throw new Error("пустой ответ");
        setFigure("btc", btcFmt.format(price), "$");
        const sign = change > 0 ? "+" : "";
        setDelta("btc-delta", change, sign + money.format(change) + "% за 24 ч");
        updatedAt.btc = Date.now();
        mark(card, "ready", "обновлено только что");
      } catch (err) {
        mark(card, "error", "Не удалось прочитать Binance. " + (err.message || "ошибка сети"));
      } finally {
        inflight.delete("btc");
      }
    }

    function refreshAll() {
      loadWeather();
      loadBtc();
    }

    document.getElementById("refresh").addEventListener("click", function () {
      const button = document.getElementById("refresh");
      button.disabled = true;
      refreshAll();
      setTimeout(function () { button.disabled = false; }, 800);
    });

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") refreshAll();
    });

    tick();
    setInterval(tick, 1000);
    refreshAll();
    setInterval(loadBtc, 20000);
    setInterval(loadWeather, 5 * 60 * 1000);
  </script>
  <noscript>Нужен JavaScript: страница сама забирает погоду и биткоин.</noscript>
</body>
</html>
